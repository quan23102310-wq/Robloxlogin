<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoàn Thành Thử Thách</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 28px;
            text-align: center;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .task-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .task-item.done {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .task-info {
            text-align: left;
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .task-status {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .task-item.done .task-status {
            color: #22c55e;
            font-weight: 600;
        }

        .btn-task {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s ease, transform 0.1s ease;
            text-decoration: none;
        }

        .btn-task:hover {
            background-color: #dc2626;
        }

        .btn-task:active {
            transform: scale(0.96);
        }

        .btn-task.completed {
            background-color: #1e293b;
            color: #22c55e;
            border: 1px solid #22c55e;
            cursor: default;
        }

        .btn-continue {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            background-color: #94a3b8;
            color: #475569;
            cursor: not-allowed;
            transition: all 0.4s ease;
        }

        .btn-continue.active {
            background-color: #22c55e;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
        }

        .btn-continue.active:hover {
            background-color: #16a34a;
        }

        #screen2 {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #334155;
            border-top: 5px solid #22c55e;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timer-text {
            font-size: 18px;
            font-weight: 700;
            color: #eab308;
            margin-top: 10px;
        }

        .menu-box {
            background: #0f172a;
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 24px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .menu-title {
            font-size: 18px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-content {
            font-size: 17px;
            font-weight: 700;
            color: #4ade80;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: THỬ THÁCH -->
    <div class="card" id="screen1">
        <h2 class="title">Hoàn Thành Thử Thách</h2>
        <p class="subtitle">Hoàn thành 2 bước bên dưới để mở khóa nút Tiếp tục</p>

        <div class="task-list">
            <!-- Bước 1 -->
            <div class="task-item" id="task1">
                <div class="task-info">
                    <div class="task-title">1. Đăng ký kênh</div>
                    <div class="task-status" id="status1">Chưa hoàn thành</div>
                </div>
                <button class="btn-task" id="btnTask1" onclick="doTask1()">Thực hiện</button>
            </div>

            <!-- Bước 2 -->
            <div class="task-item" id="task2">
                <div class="task-info">
                    <div class="task-title">2. Follow TikTok</div>
                    <div class="task-status" id="status2">Chưa hoàn thành</div>
                </div>
                <button class="btn-task" id="btnTask2" onclick="doTask2()">Thực hiện</button>
            </div>
        </div>

        <!-- Nút Tiếp tục -->
        <button class="btn-continue" id="btnContinue" disabled onclick="onContinue()">Tiếp tục</button>
    </div>

    <!-- MÀN HÌNH 2: KẾT QUẢ -->
    <div class="card" id="screen2">
        <!-- Trạng thái chờ 10s -->
        <div id="loadingBox">
            <div class="spinner"></div>
            <h3 class="title">Đang xác minh...</h3>
            <p class="subtitle">Vui lòng chờ trong giây lát</p>
            <div class="timer-text" id="timerText">Đợi (10s)</div>
        </div>

        <!-- Menu kết quả -->
        <div id="menuResult" style="display: none;">
            <div class="menu-box">
                <div class="menu-icon">🎬</div>
                <div class="menu-title">Thông Báo</div>
                <div class="menu-content">
                    sorry mn Video sẽ xuất hiện vào ngày mai, hôm nay chưa rảnh để làm
                </div>
            </div>
        </div>
    </div>

    <script>
        const YT_CHANNEL_HANDLE = '@acc.roblox.cua.toi.la.qllcln1';
        const YT_URL_WEB = 'https://youtube.com/' + YT_CHANNEL_HANDLE + '?si=i9alJL23n31MJ38c';
        const YT_URL_APP = 'intent://www.youtube.com/' + YT_CHANNEL_HANDLE + '#Intent;package=com.google.android.youtube;scheme=https;end;';

        const TIKTOK_URL = 'https://www.tiktok.com/@tuat.ngu.ngu?_r=1&_t=ZS-99VbMRDS91L';

        let step1Done = false;
        let step2Done = false;

        function openYouTubeApp() {
            const isAndroid = /Android/i.test(navigator.userAgent);
            if (isAndroid) {
                window.location.href = YT_URL_APP;
            } else {
                window.open(YT_URL_WEB, '_blank');
            }
        }

        function openTikTokApp() {
            window.open(TIKTOK_URL, '_blank');
        }

        function doTask1() {
            openYouTubeApp();
            
            const btn1 = document.getElementById('btnTask1');
            btn1.style.pointerEvents = 'none';

            // Đợi 1 giây (1000ms) trước khi hiện Hoàn thành
            setTimeout(() => {
                step1Done = true;

                const task1 = document.getElementById('task1');
                const status1 = document.getElementById('status1');

                task1.classList.add('done');
                status1.innerText = 'Đã hoàn thành ✓';
                btn1.classList.add('completed');
                btn1.innerText = 'Đã xong';
                btn1.onclick = null;

                checkCompletion();
            }, 1000);
        }

        function doTask2() {
            openTikTokApp();

            const btn2 = document.getElementById('btnTask2');
            btn2.style.pointerEvents = 'none';

            // Đợi 1 giây (1000ms) trước khi hiện Hoàn thành
            setTimeout(() => {
                step2Done = true;

                const task2 = document.getElementById('task2');
                const status2 = document.getElementById('status2');

                task2.classList.add('done');
                status2.innerText = 'Đã hoàn thành ✓';
                btn2.classList.add('completed');
                btn2.innerText = 'Đã xong';
                btn2.onclick = null;

                checkCompletion();
            }, 1000);
        }

        function checkCompletion() {
            if (step1Done && step2Done) {
                const btnContinue = document.getElementById('btnContinue');
                btnContinue.disabled = false;
                btnContinue.classList.add('active');
            }
        }

        function onContinue() {
            if (!step1Done || !step2Done) return;

            document.getElementById('screen1').style.display = 'none';
            document.getElementById('screen2').style.display = 'block';

            let countdown = 10;
            const timerText = document.getElementById('timerText');
            
            const timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    timerText.innerText = `Đợi (${countdown}s)`;
                } else {
                    clearInterval(timer);
                    document.getElementById('loadingBox').style.display = 'none';
                    document.getElementById('menuResult').style.display = 'block';
                }
            }, 1000);
        }
    </script>

</body>
</html>
